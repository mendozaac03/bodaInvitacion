<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Dashboard Invitados</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:30px;
}

.header{

    text-align:center;
    margin-bottom:40px;

}

.header h1{

    color:#c8ae7d;

}

.cards{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

    margin-bottom:40px;

}

.card{

    background:white;

    border-radius:20px;

    padding:25px;

    text-align:center;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.card-number{

    font-size:40px;

    font-weight:bold;

    color:#c8ae7d;

}

.card-title{

    margin-top:10px;

    color:#666;

}

.table-container{

    background:white;

    border-radius:20px;

    padding:20px;

    overflow-x:auto;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

}

table{

    width:100%;

    border-collapse:collapse;

}

th{

    background:#c8ae7d;

    color:white;

    padding:15px;

}

td{

    padding:15px;

    border-bottom:1px solid #eee;

}

.status-ok{

    color:green;

    font-weight:bold;

}

.status-pending{

    color:orange;

    font-weight:bold;

}
#loginScreen{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#f5f5f5;

}

.login-card{

    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.1);

    text-align:center;

}

.login-card input{

    width:100%;

    padding:12px;

    margin:20px 0;

    border-radius:10px;

    border:1px solid #ddd;

}

.login-card button{

    background:#c8ae7d;

    color:white;

    border:none;

    padding:12px 25px;

    border-radius:10px;

    cursor:pointer;

}

#loginError{

    color:red;

    margin-top:10px;

}
</style>

</head>

<body>
<div id="loginScreen">

    <div class="login-card">

        <h2>Panel Administrativo</h2>

        <input
            type="password"
            id="adminPassword"
            placeholder="Contraseña">

        <button onclick="login()">
            Ingresar
        </button>

        <p id="loginError"></p>

    </div>

</div>

<div id="dashboardContent" style="display:none;">
<div class="header">

    <h1>Tania & Abdiel</h1>

    <h2>Control de Confirmaciones</h2>

</div>

<div class="cards">

<div class="card">

    <div id="totalInvitedGuests"
         class="card-number">0</div>

    <div class="card-title">
        Invitados Totales
    </div>

</div>


    <div class="card">

        <div id="confirmedGuests"
             class="card-number">0</div>

        <div class="card-title">
            Personas Confirmadas
        </div>

    </div>

<div class="card">

    <div id="confirmationPercentage"
         class="card-number">0%</div>

    <div class="card-title">
        Confirmación %
    </div>

</div>

    <div class="card">

        <div id="totalFamilies"
             class="card-number">0</div>

        <div class="card-title">
            Familias Invitadas
        </div>

    </div>

    <div class="card">

        <div id="confirmedFamilies"
             class="card-number">0</div>

        <div class="card-title">
            Familias Confirmadas
        </div>

    </div>


    <div class="card">

        <div id="pendingFamilies"
             class="card-number">0</div>

        <div class="card-title">
            Pendientes
        </div>

    </div>

</div>

<div class="table-container">
<div style="margin-bottom:20px;">

    <label style="font-weight:600;">
        Filtrar:
    </label>

    <select
        id="statusFilter"
        onchange="filterTable()"
        style="
            padding:10px;
            border-radius:10px;
            margin-left:10px;
        ">

        <option value="ALL">
            Todos
        </option>

        <option value="CONFIRMED">
            Confirmados
        </option>

        <option value="PENDING">
            Pendientes
        </option>

    </select>

</div>
    <table>

        <thead>

        <tr>

            <th>Familia</th>
            <th>Reservados</th>
            <th>Confirmados</th>
            <th>Status</th>
            <th>Comentario</th>

        </tr>

        </thead>

        <tbody id="tableBody">

        </tbody>

    </table>

</div>
</div>

<script>
const ADMIN_PASSWORD = "Tania2026";

function login(){

    const password =
        document.getElementById(
            "adminPassword"
        ).value;

    if(password !== ADMIN_PASSWORD){

        document.getElementById(
            "loginError"
        ).innerHTML =
            "Contraseña incorrecta";

        return;
    }

    document.getElementById(
        "loginScreen"
    ).style.display = "none";

    document.getElementById(
        "dashboardContent"
    ).style.display = "block";
	}
let dashboardData = null;
loadDashboard();

async function loadDashboard(){

    const response =
        await fetch(
		   "https://invitacionbodaback.onrender.com/admin/rsvp"
        );

    dashboardData =
    await response.json();

renderDashboard(dashboardData);

}

function renderDashboard(data){

    document.getElementById(
        "totalFamilies"
    ).innerHTML =
        data.totalFamilies;

    document.getElementById(
        "confirmedFamilies"
    ).innerHTML =
        data.confirmedFamilies;

    document.getElementById(
        "confirmedGuests"
    ).innerHTML =
        data.confirmedGuests;

    document.getElementById(
        "pendingFamilies"
    ).innerHTML =
        data.pendingFamilies;
	
	document.getElementById(
    "totalInvitedGuests"
).innerHTML =
    data.totalInvitedGuests;

document.getElementById(
    "confirmationPercentage"
).innerHTML =
    data.confirmationPercentage + "%";

    renderTable(
    data.invitations
);

    document.getElementById(
        "tableBody"
    ).innerHTML = html;

}
function filterTable(){

    const filter =
        document.getElementById(
            "statusFilter"
        ).value;

    let invitations =
        dashboardData.invitations;

    if(filter === "CONFIRMED"){

        invitations =
            invitations.filter(
                x => x.confirmed
            );

    }

    if(filter === "PENDING"){

        invitations =
            invitations.filter(
                x => !x.confirmed
            );

    }

    renderTable(invitations);

}

function renderTable(invitations){

    let html = "";

    invitations.forEach(item => {

        html += `

        <tr>

            <td>${item.familyName}</td>

            <td>${item.allowedGuests}</td>

            <td>${item.guestsAttending}</td>

            <td>

                ${
                    item.confirmed
                    ? '<span class="status-ok">Confirmado</span>'
                    : '<span class="status-pending">Pendiente</span>'
                }

            </td>

            <td>
                ${item.comment || '-'}
            </td>

        </tr>

        `;

    });

    document.getElementById(
        "tableBody"
    ).innerHTML = html;

}


</script>

</body>

</html>
